<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header" class="topbar">
    <nav class="search" style="display:flex; justify-content:space-between; width:100%; align-items:center;">
        <a th:href="@{/}">UTEShop</a>
        
        <div th:if="${#authorization.expression('isAuthenticated()')}" style="display:flex; align-items:center; gap:10px;">
            <!-- Avatar -->
            <img th:src="${#authentication.principal.images != null and !#strings.isEmpty(#authentication.principal.images) ? #authentication.principal.images : '/images/avatar-default.png'}" 
                 alt="Avatar" width="40" height="40" style="border-radius:50%; object-fit:cover;">
            
            <!-- Full name -->
            <span th:text="${#authentication.principal.fullName}">Nguyễn Văn A</span>
            
            <!-- Username -->
            <span th:text="'(' + ${#authentication.principal.username} + ')'">(nguyenvana)</span>
            
            <!-- Email -->
            <span th:text="${#authentication.principal.email}">email@gmail.com</span>
            
            <!-- Role -->
            <span th:text="${#authentication.principal.role}">ROLE_USER</span>
            
            <!-- Logout -->
            <form th:action="@{/logout}" method="post" style="display:inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn danger" type="submit">Đăng xuất</button>
            </form>
        </div>
        <div th:unless="${#authorization.expression('isAuthenticated()')}">
            <a th:href="@{/login}" class="btn primary">Đăng nhập</a>
        </div>
    </nav>
</header>
</body>
</html>
